name: Metrics
on:
  # Perbarui otomatis setiap hari jam 00:00 WIB
  schedule: [{cron: "0 17 * * *"}]
  # Bisa dijalankan manual dari tab Actions
  workflow_dispatch:
  # Jalan juga setiap ada perubahan di branch main
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Kartu kiri: profil, aktivitas, komunitas, repositori
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics-profile.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          user: misbah2121
          template: classic
          config_timezone: Asia/Jakarta
          base: header, activity, community, repositories
          plugin_lines: yes

      # Kartu kanan: bahasa, kalender kontribusi, kebiasaan ngoding
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics-activity.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          user: misbah2121
          template: classic
          config_timezone: Asia/Jakarta
          base: ""
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 6
          plugin_languages_ignored: >-
            cmake, c++, swift, c, html
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_facts: no
          plugin_habits_days: 30
