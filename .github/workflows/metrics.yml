name: Metrics
on:
  # Perbarui otomatis setiap hari jam 00:00 WIB
  schedule: [{cron: "0 17 * * *"}]
  # Bisa dijalankan manual dari tab Actions
  workflow_dispatch:
  # Jalan juga setiap ada perubahan di branch main
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          # Personal access token (classic, tanpa scope tambahan) disimpan di Secrets
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          user: misbah2121
          template: classic
          config_display: large
          config_timezone: Asia/Jakarta
          base: header, activity, community, repositories, metadata

          # Kalender kontribusi 3D
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Kebiasaan ngoding (jam & hari commit)
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_facts: no
          plugin_habits_days: 30

          # Bahasa yang paling sering dipakai
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_ignored: >-
            cmake, c++, swift, c, html

          # Baris kode ditambah / dihapus
          plugin_lines: yes
